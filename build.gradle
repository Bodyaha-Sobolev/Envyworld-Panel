plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	mods {
		"envyworld" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: lets donation ranks (LuckPerms groups) use the commands without OP.
	modCompileOnly "me.lucko:fabric-permissions-api:0.7.0"

	// MixinExtras (@WrapOperation): bundled with Fabric Loader, so compile-only.
	compileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"
	annotationProcessor "io.github.llamalad7:mixinextras-fabric:0.5.5"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("licenses") { into "licenses" }
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Local verification tasks are also available to CI through the normal build.
apply from: 'tools/render-smoke.gradle'
apply from: 'tools/items-smoke.gradle'
apply from: 'tools/clipboard-smoke.gradle'

tasks.named('check') {
    dependsOn 'logCacheSmokeTest', 'catalogItemSmoke'
}
